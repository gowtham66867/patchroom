server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; media-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'" always;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    location / { try_files $uri $uri/ =404; }
    location ~* \.(mp4|png|css|js|vtt)$ { expires 1h; }
    location ~ /\. { deny all; }
}
